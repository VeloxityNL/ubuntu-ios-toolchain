name: Feature request
description: Suggest an improvement for Ubuntu iOS Toolchain
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this be useful?
    validations:
      required: true
