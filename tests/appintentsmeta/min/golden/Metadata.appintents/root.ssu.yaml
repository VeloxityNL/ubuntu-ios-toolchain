apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: org.example.IntentFixture
    intents:
    - metadata:
        name: PingIntent_0
        title: Ping
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Ping with ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - IntentFixture
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
